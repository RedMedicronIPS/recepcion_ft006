<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro FT006 Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Registro FT006 Viewer</h1>

    <!-- Formulario de filtros -->
    <form action="/filter" method="get" class="mb-4">
        <div class="flex space-x-4">
            <input type="text" name="lineaNegocio" placeholder="Linea Negocio" class="border p-2">
            <input type="text" name="establecimiento" placeholder="Establecimiento" class="border p-2">
            <input type="number" name="saldoExtracto" placeholder="Saldo Extracto" class="border p-2">
            <button type="submit" class="bg-blue-500 text-white p-2 rounded">Filtrar</button>
        </div>
    </form>

    <!-- Tabla de datos -->
    <table class="min-w-full bg-white border">
        <thead>
        <tr>
            <th class="border p-2">Linea Negocio</th>
            <th class="border p-2">Establecimiento</th>
            <th class="border p-2">ID Establecimiento</th>
            <th class="border p-2">Saldo Extracto</th>
            <th class="border p-2">Asunto Correo</th>
            <th class="border p-2">Remitente</th>
            <th class="border p-2">Fecha Correo</th>
            <th class="border p-2">Contenido Correo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="registro : ${registros}">
            <td class="border p-2" th:text="${registro.lineaNegocio}"></td>
            <td class="border p-2" th:text="${registro.establecimiento}"></td>
            <td class="border p-2" th:text="${registro.idEstablecimiento}"></td>
            <td class="border p-2" th:text="${registro.saldoExtracto}"></td>
            <td class="border p-2" th:text="${registro.asuntoCorreo}"></td>
            <td class="border p-2" th:text="${registro.remitenteCorreo}"></td>
            <td class="border p-2" th:text="${registro.fechaCorreo}"></td>
            <td class="border p-2" th:text="${registro.contenidoCorreo}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Botón para buscar correos nuevos -->
    <form action="/procesar-correos" method="post" class="mt-4">
        <button type="submit" class="bg-green-600 text-white p-2 rounded">Buscar correos nuevos</button>
    </form>
</div>
</body>
</html>
