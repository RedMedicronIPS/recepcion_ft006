<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Facturas Electrónicas</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Facturas Electrónicas</h1>

    <!-- Tabla de datos -->
    <table class="min-w-full bg-white border">
        <thead>
        <tr>
            <th class="border p-2">Número</th>
            <th class="border p-2">Fecha</th>
            <th class="border p-2">Emisor</th>
            <th class="border p-2">Receptor</th>
            <th class="border p-2">Valor Total</th>
            <th class="border p-2">CUFE</th>
            <th class="border p-2">PDF</th>
            <th class="border p-2">XML</th>
            <th class="border p-2">Asunto Correo</th>
            <th class="border p-2">Remitente</th>
            <th class="border p-2">Fecha Correo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="factura : ${facturas}">
            <td class="border p-2" th:text="${factura.numeroFactura}"></td>
            <td class="border p-2" th:text="${factura.fechaEmision}"></td>
            <td class="border p-2" th:text="${factura.emisor}"></td>
            <td class="border p-2" th:text="${factura.receptor}"></td>
            <td class="border p-2" th:text="${factura.valorTotal}"></td>
            <td class="border p-2" th:text="${factura.cufe}"></td>
            <td class="border p-2">
                <a th:href="@{${factura.pdfPath}}" th:if="${factura.pdfPath != null}" target="_blank" class="text-blue-600 underline">Ver PDF</a>
            </td>
            <td class="border p-2">
                <details>
                    <summary class="cursor-pointer text-blue-600 underline">Ver XML</summary>
                    <pre th:text="${factura.xmlContent}" class="text-xs bg-gray-100 p-2"></pre>
                </details>
            </td>
            <td class="border p-2" th:text="${factura.asuntoCorreo}"></td>
            <td class="border p-2" th:text="${factura.remitenteCorreo}"></td>
            <td class="border p-2" th:text="${factura.fechaCorreo}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Botón para buscar correos nuevos -->
    <form action="/procesar-correos" method="post" class="mt-4">
        <button type="submit" class="bg-green-600 text-white p-2 rounded">Buscar correos nuevos</button>
    </form>
</div>
</body>
</html>
